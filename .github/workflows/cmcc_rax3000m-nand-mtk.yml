name: Build cmcc_rax3000m-nand-mtk full services

on:
  workflow_dispatch:
  push:
    branches: [cmcc_rax3000m-nand-mtk]
    paths: ['.github/workflows/cmcc_rax3000m-nand-mtk.yml']

permissions:
  contents: write

concurrency:
  group: cmcc_rax3000m-nand-mtk
  cancel-in-progress: true

env:
  DEVICE: cmcc_rax3000m-nand-mtk
  PASSWALL_TAG: 26.3.6-1
  PASSWALL2_TAG: 26.3.5-1
  PASSWALL_PACKAGES_COMMIT: 3e11c458c552aefd348232c627fd1ed9f8f08e41
  HOME_PROXY_COMMIT: edece28a0085f36d469ec82c8d45f562f602db53

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - name: Prepare runner
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /opt/hostedtoolcache/Ruby
          sudo docker system prune -af || true
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk gcc-multilib gettext git libncurses-dev libssl-dev python3-setuptools rsync swig unzip zlib1g-dev file wget curl jq openssl zstd
      - uses: actions/setup-go@v5
        with:
          go-version: 1.24.x
          cache: false

      - name: Add application feeds
        run: |
          cat >> feeds.conf.default <<'FEEDS'
          src-git istore https://github.com/linkease/istore.git;main
          src-git nas_packages https://github.com/linkease/nas-packages.git;master
          src-git nas_luci https://github.com/linkease/nas-packages-luci.git;main
          FEEDS
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          ./scripts/feeds install -d y -p istore luci-app-store
          ./scripts/feeds install -d y -p nas_packages quickstart
          ./scripts/feeds install -d y -p nas_luci luci-app-quickstart

      - name: Add pinned proxy and UI sources
        run: |
          rm -rf package/luci-app-passwall package/luci-app-passwall2 package/passwall-packages
          git clone --depth=1 --branch "$PASSWALL_TAG" https://github.com/Openwrt-Passwall/openwrt-passwall.git /tmp/passwall
          mv /tmp/passwall/luci-app-passwall package/
          git clone --depth=1 --branch "$PASSWALL2_TAG" https://github.com/Openwrt-Passwall/openwrt-passwall2.git /tmp/passwall2
          mv /tmp/passwall2/luci-app-passwall2 package/
          git clone https://github.com/Openwrt-Passwall/openwrt-passwall-packages.git package/passwall-packages
          git -C package/passwall-packages checkout "$PASSWALL_PACKAGES_COMMIT"
          rm -rf package/passwall-packages/.git
          rm -rf package/homeproxy package/luci-app-homeproxy feeds/luci/applications/luci-app-homeproxy package/feeds/luci/luci-app-homeproxy
          git clone https://github.com/immortalwrt/homeproxy.git /tmp/homeproxy
          git -C /tmp/homeproxy checkout "$HOME_PROXY_COMMIT"
          rm -rf /tmp/homeproxy/.git
          cp -a /tmp/homeproxy package/homeproxy
          rm -rf package/luci-app-openclash
          git clone --depth=1 --filter=blob:none --sparse https://github.com/vernesong/OpenClash.git /tmp/openclash
          git -C /tmp/openclash sparse-checkout set luci-app-openclash
          cp -a /tmp/openclash/luci-app-openclash package/
          rm -rf package/luci-theme-argon package/luci-app-argon-config
          git clone --depth=1 https://github.com/jerrykuku/luci-theme-argon.git package/luci-theme-argon
          git clone --depth=1 https://github.com/jerrykuku/luci-app-argon-config.git package/luci-app-argon-config

      - name: Add first boot settings
        run: |
          mkdir -p package/base-files/files/etc/uci-defaults package/base-files/files/usr/libexec package/base-files/files/etc/init.d package/base-files/files/etc/hotplug.d/iface
          cat > package/base-files/files/etc/uci-defaults/90-dulwifi-defaults <<'DEFAULTS'
          #!/bin/sh
          uci -q set network.lan.ipaddr='192.168.9.1'
          uci -q commit network
          echo -e 'password\npassword' | passwd root
          n=0
          for s in $(uci -q show wireless | sed -n "s/^wireless\.\([^=]*\)=wifi-iface$/\1/p"); do
            n=$((n+1))
            [ "$n" -eq 1 ] && ssid='DulWiFi-2.4G'
            [ "$n" -eq 2 ] && ssid='DulWiFi-5G'
            [ "$n" -gt 2 ] && continue
            uci -q set wireless.$s.ssid="$ssid"
            uci -q set wireless.$s.encryption='psk2'
            uci -q set wireless.$s.key='password'
            uci -q set wireless.$s.disabled='0'
          done
          uci -q commit wireless
          exit 0
          DEFAULTS
          cat > package/base-files/files/usr/libexec/nps-wan-mac <<'NPS'
          #!/bin/sh
          [ -e /etc/nps-wan-mac.done ] && exit 0
          [ -f /etc/config/nps ] && [ -x /etc/init.d/nps ] || exit 1
          valid_mac() { case "$1" in ''|00:00:00:00:00:00) return 1;; ??:??:??:??:??:??) return 0;; *) return 1;; esac; }
          get_mac() {
            mac="$(uci -q get network.wan.macaddr)"; valid_mac "$mac" && return 0
            dev="$(uci -q get network.wan.device)"; dev="${dev#@}"
            [ -n "$dev" ] || dev="$(ip route 2>/dev/null | awk '/default/ {print $5; exit}')"
            [ -n "$dev" ] && [ -r "/sys/class/net/$dev/address" ] && mac="$(cat "/sys/class/net/$dev/address")"
            valid_mac "$mac" && return 0
            for lower in /sys/class/net/"$dev"/lower_*; do
              [ -r "$lower/address" ] || continue
              mac="$(cat "$lower/address")"; valid_mac "$mac" && return 0
            done
            return 1
          }
          tries=0
          while [ "$tries" -lt 60 ]; do get_mac && break; tries=$((tries+1)); sleep 2; done
          valid_mac "$mac" || exit 1
          key="$(printf %s "$mac" | tr -d ':' | tr '[:lower:]' '[:upper:]')"
          uci -q set nps.@nps[0].enabled='1'
          uci -q set nps.@nps[0].server_addr='47.83.9.208'
          uci -q set nps.@nps[0].server_port='8024'
          uci -q set nps.@nps[0].protocol='tcp'
          uci -q set nps.@nps[0].compress='1'
          uci -q set nps.@nps[0].crypt='1'
          uci -q set nps.@nps[0].vkey="$key"
          uci -q commit nps
          /etc/init.d/nps enable
          /etc/init.d/nps restart
          touch /etc/nps-wan-mac.done
          NPS
          cat > package/base-files/files/etc/init.d/nps-wan-mac <<'INIT'
          #!/bin/sh /etc/rc.common
          START=98
          start() { [ -e /etc/nps-wan-mac.done ] || /usr/libexec/nps-wan-mac >/dev/null 2>&1 & }
          INIT
          cat > package/base-files/files/etc/hotplug.d/iface/99-nps-wan-mac <<'HOTPLUG'
          #!/bin/sh
          [ "$INTERFACE" = wan ] && [ "$ACTION" = ifup ] && [ ! -e /etc/nps-wan-mac.done ] && /usr/libexec/nps-wan-mac >/dev/null 2>&1 &
          HOTPLUG
          cat > package/base-files/files/etc/uci-defaults/99-enable-nps-wan-mac <<'ENABLE'
          #!/bin/sh
          /etc/init.d/nps-wan-mac enable
          /etc/init.d/nps-wan-mac start
          exit 0
          ENABLE
          chmod 0755 package/base-files/files/etc/uci-defaults/90-dulwifi-defaults package/base-files/files/usr/libexec/nps-wan-mac package/base-files/files/etc/init.d/nps-wan-mac package/base-files/files/etc/hotplug.d/iface/99-nps-wan-mac package/base-files/files/etc/uci-defaults/99-enable-nps-wan-mac

      - name: Select RAX3000M and full package set
        run: |
          cp defconfig/mt7981-ax3000.config .config
          sed -i -E '/^CONFIG_TARGET_MULTI_PROFILE=/d;/^CONFIG_TARGET_PER_DEVICE_ROOTFS=/d;/^CONFIG_TARGET_DEVICE_mediatek_.*_DEVICE_/d;/^CONFIG_TARGET_DEVICE_PACKAGES_mediatek_.*_DEVICE_/d;/^CONFIG_TARGET_mediatek_filogic_DEVICE_/d;/^# CONFIG_TARGET_mediatek_filogic_DEVICE_.* is not set/d' .config
          cat >> .config <<'CONFIG'
          CONFIG_TARGET_mediatek=y
          CONFIG_TARGET_mediatek_filogic=y
          CONFIG_TARGET_mediatek_filogic_DEVICE_cmcc_rax3000m-nand-mtk=y
          CONFIG_PACKAGE_luci=y
          CONFIG_LUCI_LANG_zh_Hans=y
          CONFIG_PACKAGE_kmod-conninfra=y
          CONFIG_PACKAGE_kmod-mt_wifi=y
          CONFIG_PACKAGE_kmod-warp=y
          CONFIG_PACKAGE_mtwifi-cfg=y
          CONFIG_PACKAGE_luci-app-mtwifi-cfg=y
          CONFIG_PACKAGE_luci-app-store=y
          CONFIG_PACKAGE_luci-app-quickstart=y
          CONFIG_PACKAGE_luci-theme-argon=y
          CONFIG_PACKAGE_luci-app-argon-config=y
          CONFIG_PACKAGE_luci-app-ttyd=y
          CONFIG_PACKAGE_luci-app-passwall=y
          CONFIG_PACKAGE_luci-app-passwall2=y
          CONFIG_PACKAGE_luci-app-homeproxy=y
          CONFIG_PACKAGE_luci-app-openclash=y
          CONFIG_PACKAGE_luci-app-nps=y
          CONFIG_PACKAGE_npc=y
          CONFIG_PACKAGE_luci-app-advanced-reboot=y
          CONFIG_PACKAGE_luci-app-watchcat=y
          CONFIG
          make defconfig
          for p in kmod-mt_wifi mtwifi-cfg luci-app-store luci-app-quickstart luci-theme-argon luci-app-ttyd luci-app-passwall luci-app-passwall2 luci-app-homeproxy luci-app-openclash luci-app-nps npc; do
            grep -q "^CONFIG_PACKAGE_${p//-/_}=y$" .config || grep -q "^CONFIG_PACKAGE_$p=y$" .config || { echo "Missing $p"; exit 1; }
          done
          grep -q '^CONFIG_TARGET_mediatek_filogic_DEVICE_cmcc_rax3000m-nand-mtk=y$' .config
          ./scripts/diffconfig.sh | tee build.config

      - name: Download and compile
        run: |
          make download -j"$(nproc)"
          rm -rf dl/go-mod-cache
          make -j"$(nproc)" || make -j1 V=s

      - name: Verify and collect
        run: |
          mkdir -p release
          IMAGE=$(find bin/targets/mediatek/filogic -type f -name "*cmcc_rax3000m-nand-mtk*sysupgrade.bin" -size +5M | head -n1)
          test -n "$IMAGE"
          MANIFEST=$(find bin/targets/mediatek/filogic -type f -name "*cmcc_rax3000m-nand-mtk*.manifest" | head -n1)
          test -n "$MANIFEST"
          for p in kmod-mt_wifi luci-app-store luci-app-passwall luci-app-passwall2 luci-app-homeproxy luci-app-openclash luci-app-nps npc; do grep -q "^$p " "$MANIFEST" || exit 1; done
          cp "$IMAGE" "$MANIFEST" build.config release/
          sha256sum release/* | tee release/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: cmcc_rax3000m-nand-mtk-full-${{ github.run_number }}
          path: release/
          if-no-files-found: error
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="cmcc_rax3000m-nand-mtk-full-${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" release/* --target "${GITHUB_SHA}" --title "cmcc_rax3000m-nand-mtk full services ${GITHUB_RUN_NUMBER}" --notes "MTK proprietary WiFi; 192.168.9.1/password; DulWiFi 2.4G and 5G; PassWall 26.3.6-1; PassWall2 26.3.5-1; HomeProxy, OpenClash, iStore, QuickStart, Argon, TTYD and feed NPS. NPS uses first-boot physical WAN MAC key and 47.83.9.208:8024."
