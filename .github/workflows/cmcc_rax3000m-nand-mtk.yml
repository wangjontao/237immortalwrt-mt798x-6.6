name: Build cmcc_rax3000m-nand-mtk

on:
  workflow_dispatch:
  push:
    branches:
      - cmcc_rax3000m-nand-mtk
    paths:
      - '.github/workflows/cmcc_rax3000m-nand-mtk.yml'

permissions:
  contents: write

concurrency:
  group: cmcc_rax3000m-nand-mtk
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      DEVICE: cmcc_rax3000m-nand-mtk
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /opt/hostedtoolcache/Ruby
          sudo docker system prune -af || true
          sudo apt-get clean
          df -h

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk gcc-multilib gettext git libncurses-dev libssl-dev python3 python3-distutils rsync unzip zlib1g-dev file wget curl jq libelf-dev
          echo "MAKEFLAGS=-j$(nproc)" >> "$GITHUB_ENV"

      - name: Update feeds
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Select device using source configuration
        run: |
          cp defconfig/mt7981-ax3000.config .config
          sed -i -E '/^CONFIG_TARGET_MULTI_PROFILE=/d;/^CONFIG_TARGET_PER_DEVICE_ROOTFS=/d;/^CONFIG_TARGET_DEVICE_mediatek_.*_DEVICE_/d;/^CONFIG_TARGET_DEVICE_PACKAGES_mediatek_.*_DEVICE_/d;/^CONFIG_TARGET_mediatek_filogic_DEVICE_/d;/^# CONFIG_TARGET_mediatek_filogic_DEVICE_.* is not set/d' .config
          cat >> .config <<'CONFIG'
          CONFIG_TARGET_mediatek=y
          CONFIG_TARGET_mediatek_filogic=y
          CONFIG_TARGET_mediatek_filogic_DEVICE_cmcc_rax3000m-nand-mtk=y
          CONFIG_PACKAGE_luci=y
          CONFIG_LUCI_LANG_zh_Hans=y
          CONFIG

          make defconfig
          grep -q '^CONFIG_TARGET_mediatek_filogic_DEVICE_cmcc_rax3000m-nand-mtk=y$' .config
          grep -q '^CONFIG_PACKAGE_kmod-mt_wifi=y$' .config
          grep -q '^CONFIG_PACKAGE_mtwifi-cfg=y$' .config
          ./scripts/diffconfig.sh | tee build.config

      - name: Download sources
        run: |
          make download -j8
          find dl -size -1024c -delete || true

      - name: Build firmware
        run: |
          rm -rf dl/go-mod-cache
          make -j"$(nproc)" V=s || make -j1 V=s

      - name: Collect and verify images
        run: |
          mkdir -p release
          IMAGE=$(find bin/targets/mediatek/filogic -type f -name "*cmcc_rax3000m-nand-mtk*sysupgrade.bin" | head -n1)
          test -n "$IMAGE"
          cp "$IMAGE" release/
          find bin/targets/mediatek/filogic -type f \( -name "*cmcc_rax3000m-nand-mtk*.manifest" -o -name "*cmcc_rax3000m-nand-mtk*preloader.bin" -o -name "*cmcc_rax3000m-nand-mtk*bl31-uboot.fip" \) -exec cp {} release/ \;
          cp build.config release/
          sha256sum release/* | tee release/SHA256SUMS
          ls -lh release

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: cmcc_rax3000m-nand-mtk-${{ github.run_number }}
          path: release/
          if-no-files-found: error
          retention-days: 30

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="cmcc_rax3000m-nand-mtk-${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" release/* --target "${GITHUB_SHA}" --title "cmcc_rax3000m-nand-mtk build ${GITHUB_RUN_NUMBER}" --notes "Built from branch cmcc_rax3000m-nand-mtk using the source tree's existing device configuration. Source commit: ${GITHUB_SHA}"
