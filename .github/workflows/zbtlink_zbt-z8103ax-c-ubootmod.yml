name: Build zbtlink_zbt-z8103ax-c-ubootmod

on:
  workflow_dispatch:
  push:
    branches:
      - zbtlink_zbt-z8103ax-c-ubootmod
    paths:
      - '.github/workflows/zbtlink_zbt-z8103ax-c-ubootmod.yml'

permissions:
  contents: write

concurrency:
  group: zbtlink_zbt-z8103ax-c-ubootmod
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      DEVICE: zbtlink_zbt-z8103ax-c-ubootmod
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /opt/hostedtoolcache/Ruby
          sudo docker system prune -af || true
          sudo apt-get clean
          df -h

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk gcc-multilib gettext git libncurses-dev libssl-dev python3 python3-distutils rsync unzip zlib1g-dev file wget curl jq libelf-dev
          echo "MAKEFLAGS=-j$(nproc)" >> "$GITHUB_ENV"

      - name: Update feeds
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Select device using source configuration
        run: |
          cat > .config <<'CONFIG'
          CONFIG_TARGET_mediatek=y
          CONFIG_TARGET_mediatek_filogic=y
          CONFIG_TARGET_mediatek_filogic_DEVICE_zbtlink_zbt-z8103ax-c-ubootmod=y
          CONFIG_PACKAGE_luci=y
          CONFIG_LUCI_LANG_zh_Hans=y
          CONFIG

          make defconfig
          grep -q '^CONFIG_TARGET_mediatek_filogic_DEVICE_zbtlink_zbt-z8103ax-c-ubootmod=y$' .config
          grep -q '^CONFIG_PACKAGE_kmod-mt7915e=y$' .config
          grep -q '^CONFIG_PACKAGE_kmod-mt7981-firmware=y$' .config
          ./scripts/diffconfig.sh | tee build.config

      - name: Download sources
        run: |
          make download -j8
          find dl -size -1024c -delete || true

      - name: Build firmware
        run: |
          rm -rf dl/go-mod-cache
          make -j"$(nproc)" V=s || make -j1 V=s

      - name: Collect and verify images
        run: |
          mkdir -p release
          IMAGE=$(find bin/targets/mediatek/filogic -type f -name "*zbtlink_zbt-z8103ax-c-ubootmod*sysupgrade.itb" | head -n1)
          test -n "$IMAGE"
          cp "$IMAGE" release/
          find bin/targets/mediatek/filogic -type f \( -name "*zbtlink_zbt-z8103ax-c-ubootmod*.manifest" -o -name "*zbtlink_zbt-z8103ax-c-ubootmod*preloader.bin" -o -name "*zbtlink_zbt-z8103ax-c-ubootmod*bl31-uboot.fip" \) -exec cp {} release/ \;
          cp build.config release/
          sha256sum release/* | tee release/SHA256SUMS
          ls -lh release

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: zbtlink_zbt-z8103ax-c-ubootmod-${{ github.run_number }}
          path: release/
          if-no-files-found: error
          retention-days: 30

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="zbtlink_zbt-z8103ax-c-ubootmod-${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" release/* --target "${GITHUB_SHA}" --title "zbtlink_zbt-z8103ax-c-ubootmod build ${GITHUB_RUN_NUMBER}" --notes "Built from branch zbtlink_zbt-z8103ax-c-ubootmod using the source tree's existing device configuration. Source commit: ${GITHUB_SHA}"
