name: HY3000 default tree build
on:
  workflow_dispatch:
  push:
    branches: [ "codex/hy3000-default-tree" ]
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Build with repository defaults
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk gcc-multilib gettext git libncurses-dev libssl-dev python3-setuptools rsync unzip zlib1g-dev file wget
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          cp Config/HY3000.txt .config
          make defconfig
          rm -rf dl/go-mod-cache
          make download -j2 V=s
          make -j2 V=s
      - uses: actions/upload-artifact@v4
        with:
          name: HY3000-default-tree
          path: bin/targets/mediatek/filogic/*
