name: HY3000-24.10-MTK-WiFi-LuCI-NPS

on:
  workflow_dispatch:
  push:
    branches:
      - codex/hy3000-24.10-mtkwifi-nps

permissions:
  contents: write


env:
  WRT_REPO: https://github.com/wangjontao/237immortalwrt-mt798x-6.6.git
  WRT_BRANCH: openwrt-24.10-6.6
  PASSWALL_TAG: 26.3.6-1
  PASSWALL2_TAG: 26.3.5-1
  PASSWALL_PACKAGES_COMMIT: 3e11c458c552aefd348232c627fd1ed9f8f08e41
  NPS_OPENWRT_COMMIT: 480f2e502575641a0c9280d6fad971550621316d
  HOME_PROXY_COMMIT: edece28a0085f36d469ec82c8d45f562f602db53

jobs:
  build:
    name: Philips HY3000 MTK WiFi LuCI NPS
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: Checkout build configuration
        uses: actions/checkout@v4

      - name: Initialize build environment
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk gcc-multilib \
            gettext git libncurses-dev libssl-dev python3-setuptools rsync swig unzip \
            zlib1g-dev file wget curl jq openssl ccache zstd
          sudo timedatectl set-timezone Asia/Shanghai
          sudo mkdir -p /mnt/build_wrt
          sudo chown "$USER:$USER" /mnt/build_wrt
          ln -s /mnt/build_wrt "$GITHUB_WORKSPACE/wrt"

      - name: Install Go 1.24
        uses: actions/setup-go@v5
        with:
          go-version: 1.24.x
          cache: false

      - name: Clone ImmortalWrt 24.10 source
        run: |
          git clone --depth=1 --single-branch --branch "$WRT_BRANCH" "$WRT_REPO" wrt/
          cd wrt
          echo "WRT_HASH=$(git rev-parse --short HEAD)" >> "$GITHUB_ENV"
          echo "BUILD_DATE=$(date +'%Y.%m.%d-%H.%M.%S')" >> "$GITHUB_ENV"
          test -f target/linux/mediatek/dts/mt7981b-philips-hy3000.dts
          grep -q 'TARGET_DEVICES += philips_hy3000' target/linux/mediatek/image/filogic.mk


      - name: Restore downloads and compiler cache
        uses: actions/cache@v4
        with:
          path: |
            wrt/dl
            wrt/.ccache
          key: hy3000-mtkwifi-luci-nps-24.10-${{ env.WRT_BRANCH }}-${{ hashFiles('Config/HY3000.txt', 'Config/PRIVATE.txt', 'Config/HY3000-iStore-QuickStart.txt', '.github/workflows/HY3000-DulWiFi.yml') }}
          restore-keys: |
            hy3000-mtkwifi-luci-nps-24.10-${{ env.WRT_BRANCH }}-

      - name: Update feeds and add iStore
        working-directory: wrt
        run: |
          grep -q '^src-git istore ' feeds.conf.default || echo 'src-git istore https://github.com/linkease/istore.git;main' >> feeds.conf.default
          grep -q '^src-git nas_packages ' feeds.conf.default || echo 'src-git nas_packages https://github.com/linkease/nas-packages.git;master' >> feeds.conf.default
          grep -q '^src-git nas_luci ' feeds.conf.default || echo 'src-git nas_luci https://github.com/linkease/nas-packages-luci.git;main' >> feeds.conf.default
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          ./scripts/feeds install -d y -p istore luci-app-store
          ./scripts/feeds install -d y -p nas_packages quickstart
          ./scripts/feeds install -d y -p nas_luci luci-app-quickstart

      - name: Add fixed proxy and NPC packages
        working-directory: wrt
        run: |
          rm -rf package/luci-app-passwall package/luci-app-passwall2 \
            package/passwall-packages package/npc package/luci-app-npc \
            feeds/luci/applications/luci-app-passwall \
            feeds/luci/applications/luci-app-passwall2 \
            feeds/luci/applications/luci-app-npc \
            feeds/luci/applications/luci-app-nps \
            feeds/packages/net/npc feeds/packages/net/nps \
            package/feeds/luci/luci-app-npc package/feeds/luci/luci-app-nps \
            package/feeds/packages/npc package/feeds/packages/nps

          git clone --depth=1 --branch "$PASSWALL_TAG" \
            https://github.com/Openwrt-Passwall/openwrt-passwall.git /tmp/openwrt-passwall
          mv /tmp/openwrt-passwall/luci-app-passwall package/

          git clone --depth=1 --branch "$PASSWALL2_TAG" \
            https://github.com/Openwrt-Passwall/openwrt-passwall2.git /tmp/openwrt-passwall2
          mv /tmp/openwrt-passwall2/luci-app-passwall2 package/

          git clone https://github.com/Openwrt-Passwall/openwrt-passwall-packages.git \
            package/passwall-packages
          git -C package/passwall-packages checkout "$PASSWALL_PACKAGES_COMMIT"
          rm -rf package/passwall-packages/.git

          git clone https://github.com/djylb/nps-openwrt.git /tmp/nps-openwrt
          git -C /tmp/nps-openwrt checkout "$NPS_OPENWRT_COMMIT"
          cp -a /tmp/nps-openwrt/npc package/

          # Client UI with separate address/port fields, matching the reference image.
          git clone --depth=1 --filter=blob:none --sparse https://github.com/coolsnowwolf/luci.git /tmp/lean-luci
          git -C /tmp/lean-luci sparse-checkout set applications/luci-app-nps
          cp -a /tmp/lean-luci/applications/luci-app-nps package/luci-app-nps
          sed -i 's#include ../../luci.mk#include $(TOPDIR)/feeds/luci/luci.mk#' package/luci-app-nps/Makefile
          cat > package/luci-app-nps/root/etc/config/nps <<'NPS_CONFIG'
          config nps
                  option enabled '1'
                  option server_addr '47.83.9.208'
                  option server_port '8024'
                  option protocol 'tcp'
                  option compress '0'
                  option crypt '0'
                  option vkey 'WANMAC'
                  option log_level '4'
          NPS_CONFIG

          rm -rf package/homeproxy package/luci-app-homeproxy feeds/luci/applications/luci-app-homeproxy package/feeds/luci/luci-app-homeproxy
          git clone https://github.com/VIKINGYFY/homeproxy.git /tmp/homeproxy
          git -C /tmp/homeproxy checkout "$HOME_PROXY_COMMIT"
          rm -rf /tmp/homeproxy/.git
          cp -a /tmp/homeproxy package/homeproxy

          rm -rf package/luci-theme-argon package/luci-app-argon-config
          git clone --depth=1 https://github.com/jerrykuku/luci-theme-argon.git package/luci-theme-argon
          git clone --depth=1 https://github.com/jerrykuku/luci-app-argon-config.git package/luci-app-argon-config

      - name: Apply HY3000 MTK WiFi and LuCI NPS configuration
        working-directory: wrt
        run: |
          rm -f .config
          # Import the source's complete vendor driver feature selection.
          test -s defconfig/mt7981-ax3000.config
          grep -E '^(CONFIG_(MTK_|WARP_|WED_|CONNINFRA_|first_card)|# CONFIG_MTK_)' defconfig/mt7981-ax3000.config > /tmp/hy3000-vendor.config
          cat "$GITHUB_WORKSPACE/Config/HY3000.txt" \
              "$GITHUB_WORKSPACE/Config/PRIVATE.txt" \
              "$GITHUB_WORKSPACE/Config/HY3000-iStore-QuickStart.txt" > .config

          cat >> .config <<'WIFI_EOF'
          CONFIG_first_card=y
          CONFIG_first_card_name="MT7981"
          CONFIG_MTK_CHIP_MT7981=y
          CONFIG_MTK_CONNINFRA_APSOC=y
          CONFIG_MTK_CONNINFRA_APSOC_MT7981=y
          CONFIG_MTK_FIRST_IF_MT7981=y
          CONFIG_MTK_MT7981_NEW_FW=n
          CONFIG_MTK_MT_AP_SUPPORT=m
          CONFIG_MTK_MT_WIFI=m
          CONFIG_MTK_MT_WIFI_PATH="mt_wifi"
          CONFIG_MTK_WIFI_BASIC_FUNC=y
          CONFIG_MTK_WIFI_DRIVER=y
          CONFIG_MTK_WIFI_MODE_AP=m
          CONFIG_MTK_WIFI_MT_MAC=y
          CONFIG_MTK_SUPPORT_OPENWRT=y
          CONFIG_MTK_WIFI_FW_BIN_LOAD=y
          CONFIG_MTK_WLAN_SERVICE=y
          CONFIG_PACKAGE_kmod-conninfra=y
          CONFIG_PACKAGE_kmod-mt_wifi=y
          CONFIG_PACKAGE_kmod-warp=y
          CONFIG_PACKAGE_mtwifi-cfg=y
          CONFIG_PACKAGE_luci-app-mtwifi-cfg=y
          CONFIG_PACKAGE_luci-i18n-mtwifi-cfg-zh-cn=y
          CONFIG_PACKAGE_wifi-scripts=y
          CONFIG_PACKAGE_wifi-dats=y
          CONFIG_PACKAGE_wireless-regdb=y
          CONFIG_PACKAGE_wireless-tools=y
          WIFI_EOF

          cp -a "$GITHUB_WORKSPACE/Files/." package/base-files/files/
          rm -f package/base-files/files/etc/init.d/npc-wan-mac
          rm -f package/base-files/files/etc/uci-defaults/99-enable-npc-wan-mac
          rm -f package/base-files/files/usr/libexec/npc-wan-mac
          chmod 0755 package/base-files/files/etc/uci-defaults/99-dulwifi

          mkdir -p package/base-files/files/usr/libexec package/base-files/files/etc/hotplug.d/iface
          cat > package/base-files/files/usr/libexec/nps-wan-mac <<'NPS_MAC'
          #!/bin/sh
          DONE=/etc/nps-wan-mac.done
          [ -e "$DONE" ] && exit 0
          valid_mac() {
                  case "$1" in ''|00:00:00:00:00:00) return 1;; ??:??:??:??:??:??) return 0;; *) return 1;; esac
          }
          get_mac() {
                  mac="$(uci -q get network.wan.macaddr)"
                  valid_mac "$mac" && return 0
                  dev="$(ubus call network.interface.wan status 2>/dev/null | jsonfilter -e '@.l3_device' 2>/dev/null)"
                  [ -n "$dev" ] || dev="$(ubus call network.interface.wan status 2>/dev/null | jsonfilter -e '@.device' 2>/dev/null)"
                  [ -n "$dev" ] || dev="$(uci -q get network.wan.device)"
                  dev="${dev#@}"
                  [ -n "$dev" ] && mac="$(ubus call network.device status "{\"name\":\"$dev\"}" 2>/dev/null | jsonfilter -e '@.macaddr' 2>/dev/null)"
                  valid_mac "$mac" && return 0
                  [ -n "$dev" ] && [ -r "/sys/class/net/$dev/address" ] && mac="$(cat "/sys/class/net/$dev/address")"
                  valid_mac "$mac"
          }
          tries=0; mac=''
          while [ "$tries" -lt 60 ]; do get_mac && break; tries=$((tries + 1)); sleep 2; done
          valid_mac "$mac" || { logger -t nps-wan-mac 'WAN MAC not found'; exit 1; }
          vkey="$(printf '%s' "$mac" | tr -d ':' | tr '[:lower:]' '[:upper:]')"
          uci -q set nps.@nps[0].enabled='1'
          uci -q set nps.@nps[0].server_addr='47.83.9.208'
          uci -q set nps.@nps[0].server_port='8024'
          uci -q set nps.@nps[0].protocol='tcp'
          uci -q set nps.@nps[0].vkey="$vkey"
          uci -q commit nps
          /etc/init.d/nps enable
          /etc/init.d/nps restart
          touch "$DONE"
          logger -t nps-wan-mac 'WAN MAC written to NPS vkey on first boot'
          NPS_MAC
          cat > package/base-files/files/etc/init.d/nps-wan-mac <<'NPS_INIT'
          #!/bin/sh /etc/rc.common
          START=98
          STOP=10
          start() { [ -e /etc/nps-wan-mac.done ] || /usr/libexec/nps-wan-mac >/dev/null 2>&1 & }
          NPS_INIT
          cat > package/base-files/files/etc/hotplug.d/iface/99-nps-wan-mac <<'NPS_HOTPLUG'
          #!/bin/sh
          [ -e /etc/nps-wan-mac.done ] && exit 0
          if [ "$INTERFACE" = 'wan' ] && [ "$ACTION" = 'ifup' ]; then
                  /usr/libexec/nps-wan-mac >/dev/null 2>&1 &
          fi
          NPS_HOTPLUG
          cat > package/base-files/files/etc/uci-defaults/99-enable-nps-wan-mac <<'NPS_DEFAULT'
          #!/bin/sh
          /etc/init.d/nps-wan-mac enable
          /etc/init.d/nps-wan-mac start
          exit 0
          NPS_DEFAULT
          chmod 0755 package/base-files/files/usr/libexec/nps-wan-mac
          chmod 0755 package/base-files/files/etc/init.d/nps-wan-mac
          chmod 0755 package/base-files/files/etc/hotplug.d/iface/99-nps-wan-mac
          chmod 0755 package/base-files/files/etc/uci-defaults/99-enable-nps-wan-mac

          sed -i "s/192\\.168\\.[0-9]*\\.[0-9]*/192.168.7.1/g" \
            package/base-files/files/bin/config_generate
          sed -i "s/hostname='.*'/hostname='DulWiFi'/g" \
            package/base-files/files/bin/config_generate

          ROOT_HASH="$(openssl passwd -1 '@password@')"
          sed -i "s#^root:[^:]*:#root:${ROOT_HASH}:#" \
            package/base-files/files/etc/shadow

          cat /tmp/hy3000-vendor.config >> .config
          make defconfig

          # Force the final package selection after Kconfig has resolved the
          # MT7981 choice symbols. This keeps the proprietary Wi-Fi modules and
          # the newly added LuCI NPS client in the same image.
          for symbol in \
            PACKAGE_kmod-conninfra PACKAGE_kmod-mt_wifi PACKAGE_kmod-warp \
            PACKAGE_mtwifi-cfg PACKAGE_luci-app-mtwifi-cfg PACKAGE_wifi-dats \
            PACKAGE_luci-app-store PACKAGE_luci-app-quickstart \
            PACKAGE_luci-theme-argon PACKAGE_luci-app-argon-config \
            PACKAGE_luci-app-ttyd PACKAGE_luci-app-passwall \
            PACKAGE_luci-app-passwall2 PACKAGE_luci-app-homeproxy \
            PACKAGE_luci-app-nps; do
            sed -i "/^CONFIG_${symbol}=/d;/^# CONFIG_${symbol} is not set/d" .config
            echo "CONFIG_${symbol}=y" >> .config
          done
          sed -i '/^CONFIG_PACKAGE_luci-app-npc=/d;/^# CONFIG_PACKAGE_luci-app-npc is not set/d' .config
          echo '# CONFIG_PACKAGE_luci-app-npc is not set' >> .config
          sed -i '/^CONFIG_WARP_VERSION=/d;/^CONFIG_WARP_CHIPSET=/d' .config
          printf '%s\n' 'CONFIG_WARP_VERSION=2' 'CONFIG_WARP_CHIPSET="mt7981"' 'CONFIG_MTK_WARP_V2=y' 'CONFIG_MTK_WHNAT_SUPPORT=m' >> .config
          make defconfig

          grep -qx 'CONFIG_MTK_WIFI_EAP_FEATURE=y' .config
          grep -qx 'CONFIG_MTK_MGMT_TXPWR_CTRL=y' .config
          grep -qx 'CONFIG_WARP_VERSION=2' .config
          grep -qx 'CONFIG_WARP_CHIPSET="mt7981"' .config
          echo '=== selected HY3000 configuration ==='
          grep -E '^CONFIG_TARGET|philips_hy3000|kmod-(mt_wifi|conninfra)|mtwifi-cfg|luci-app-(store|quickstart|ttyd|passwall|passwall2|homeproxy|nps)|argon' .config | head -220
          grep -q '^CONFIG_TARGET_mediatek_filogic_DEVICE_philips_hy3000=y' .config
          grep -q '^CONFIG_PACKAGE_luci-app-store=y' .config
          grep -q '^CONFIG_PACKAGE_luci-app-quickstart=y' .config
          grep -q '^CONFIG_PACKAGE_luci-theme-argon=y' .config
          grep -q '^CONFIG_PACKAGE_luci-app-argon-config=y' .config
          grep -q '^CONFIG_PACKAGE_luci-app-ttyd=y' .config
          grep -q '^CONFIG_PACKAGE_kmod-mt_wifi=y' .config
          grep -q '^CONFIG_PACKAGE_kmod-conninfra=y' .config
          grep -q '^CONFIG_PACKAGE_mtwifi-cfg=y' .config
          grep -q '^CONFIG_PACKAGE_luci-app-passwall=y' .config
          grep -q '^CONFIG_PACKAGE_luci-app-passwall2=y' .config
          grep -q '^CONFIG_PACKAGE_luci-app-homeproxy=y' .config
          grep -q '^CONFIG_PACKAGE_luci-app-nps=y' .config
          ! grep -q '^CONFIG_PACKAGE_luci-app-npc=y' .config
          ./scripts/diffconfig.sh | tee "$GITHUB_WORKSPACE/HY3000-MTK-WiFi-LuCI-NPS-final.config"

      - name: Download sources
        working-directory: wrt
        run: |
          make download -j"$(nproc)"
          # Keep small Go source files in dl/go-mod-cache intact.

      - name: Compile firmware
        working-directory: wrt
        run: |
          # The shared Go cache can contain partial module trees after an
          # interrupted sing-box build. Recreate it before compiling.
          rm -rf dl/go-mod-cache
          mkdir -p dl/go-mod-cache
          make target/linux/prepare -j"$(nproc)"
          DRIVER="$(find build_dir -path '*/drivers/net/ethernet/mediatek/mtk_eth_soc.c' -type f | head -n1)"
          test -n "$DRIVER"
          sed -i '1i#define HIT_BIND_FORCE_TO_CPU 0x1d\n#define MTK_FE_START_RESET 0x100\n#define MTK_FE_RESET_NAT_DONE 0x101\n#define MTK_FE_RESET_DONE 0x102\n#define MTK_WIFI_RESET_DONE 0x103\n#define MTK_WIFI_CHIP_ONLINE 0x104\n#define MTK_WIFI_CHIP_OFFLINE 0x105' "$DRIVER"
          make tools/install -j"$(nproc)"
          make toolchain/install -j"$(nproc)"
          make target/linux/compile -j"$(nproc)"
          make package/mtk/drivers/warp/compile -j1 V=s
          make package/mtk/drivers/mt_wifi/compile -j1 V=s
          make package/feeds/packages/sing-box/compile -j1 V=s
          make package/npc/compile -j1 V=s

      - name: Compile full firmware after critical packages
        working-directory: wrt
        run: make -j"$(nproc)" || make -j1 V=s

      - name: Verify and collect HY3000 firmware
        working-directory: wrt
        run: |
          mkdir -p upload
          mapfile -t images < <(find bin/targets/mediatek/filogic -maxdepth 1 -type f -iname '*philips_hy3000*sysupgrade*' -size +5M)
          if [ "${#images[@]}" -eq 0 ]; then
            echo 'ERROR: no Philips HY3000 sysupgrade image was produced.'
            find bin/targets/mediatek/filogic -maxdepth 1 -type f -printf '%f %s bytes\n' | sort
            exit 1
          fi
          cp -a "${images[@]}" upload/
          mapfile -t manifests < <(find bin/targets/mediatek/filogic -maxdepth 1 -type f -name '*philips_hy3000*.manifest')
          if [ "${#manifests[@]}" -eq 0 ]; then
            echo 'ERROR: HY3000 package manifest is missing.'
            exit 1
          fi
          grep -q '^kmod-mt_wifi ' "${manifests[0]}" || { echo 'ERROR: kmod-mt_wifi is missing from HY3000 firmware.'; exit 1; }
          grep -q '^kmod-conninfra ' "${manifests[0]}" || { echo 'ERROR: kmod-conninfra is missing from HY3000 firmware.'; exit 1; }
          grep -q '^mtwifi-cfg ' "${manifests[0]}" || { echo 'ERROR: mtwifi-cfg is missing from HY3000 firmware.'; exit 1; }
          grep -q '^luci-app-nps ' "${manifests[0]}" || { echo 'ERROR: luci-app-nps is missing from HY3000 firmware.'; exit 1; }
          grep -q '^npc ' "${manifests[0]}" || { echo 'ERROR: npc client is missing from HY3000 firmware.'; exit 1; }
          cp -a "${manifests[@]}" upload/
          find bin/targets/mediatek/filogic -maxdepth 1 -type f -name '*.buildinfo' -exec cp -a {} upload/ \;
          cp "$GITHUB_WORKSPACE/HY3000-MTK-WiFi-LuCI-NPS-final.config" upload/
          sha256sum upload/* | tee upload/SHA256SUMS
          ls -lh upload

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: Philips-HY3000-MTK-WiFi-LuCI-NPS-24.10-${{ env.BUILD_DATE }}
          path: wrt/upload/*
          if-no-files-found: error
          retention-days: 30

      - name: Publish firmware release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: Philips-HY3000-MTK-WiFi-LuCI-NPS-24.10-${{ env.BUILD_DATE }}
          name: Philips HY3000 MTK WiFi LuCI NPS 24.10 ${{ env.BUILD_DATE }}
          files: wrt/upload/*
          body: |
            Philips HY3000 eMMC / MT7981 / source-default memory definition / ImmortalWrt 24.10 / kernel 6.6
            Source commit: ${{ env.WRT_HASH }}
            Management IP: 192.168.7.1
            Wi-Fi: DulWiFi-5G / DulWiFi-2.4G
            PassWall: 26.3.6-1
            PassWall2: 26.3.5-1
            Included: fixed MT7981 mt_wifi driver, iStore, QuickStart home page, Argon theme, TTYD, common LuCI tools, PassWall, PassWall2, HomeProxy, luci-app-nps client
            NPS client: 47.83.9.208:8024 TCP; WAN MAC is used as uppercase vkey without colons.
