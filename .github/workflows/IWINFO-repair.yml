name: RAX3000M libiwinfo repair package
on:
  push:
    branches: [repair/rax3000m-iwinfo]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - name: Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk gcc-multilib gettext git libncurses-dev libssl-dev python3-setuptools rsync swig unzip zlib1g-dev file wget curl zstd
      - uses: actions/cache@v4
        with:
          path: dl
          key: iwinfo-repair-downloads-v1
      - name: Configure matching target
        run: |
          cp defconfig/mt7981-ax3000.config .config
          sed -i '/^CONFIG_TARGET_mediatek_filogic_DEVICE_.*=y$/d' .config
          printf '\nCONFIG_TARGET_mediatek_filogic_DEVICE_cmcc_rax3000m-nand-mtk=y\nCONFIG_PACKAGE_libiwinfo=y\n' >> .config
          make defconfig
          sed -i 's/^PKG_RELEASE:=1$/PKG_RELEASE:=2/' package/network/utils/iwinfo/Makefile
      - name: Build toolchain and repaired library
        run: |
          make tools/install -j2 || make tools/install -j1 V=s
          make toolchain/install -j2 || make toolchain/install -j1 V=s
          make package/network/utils/iwinfo/compile -j2 V=s
      - name: Collect repair package
        run: |
          mkdir repair-package
          find bin/packages -type f -name 'libiwinfo*.ipk' -exec cp {} repair-package/ \;
          test -n "$(find repair-package -name 'libiwinfo*.ipk' -print -quit)"
          git diff HEAD^ HEAD -- package/network/utils/iwinfo/src/iwinfo_mtk.c > repair-package/source-fix.patch
          sha256sum repair-package/* > repair-package/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: RAX3000M-libiwinfo-repair
          path: repair-package/
          if-no-files-found: error
      - name: Publish repair package
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "rax3000m-iwinfo-repair-${GITHUB_RUN_NUMBER}" repair-package/* --target "$GITHUB_SHA" --title 'RAX3000M libiwinfo repair candidate' --notes 'Fix MTK interface name lifetime after freeing UCI context. Built from 237 source. Device validation is required before calling this a verified fix.'
